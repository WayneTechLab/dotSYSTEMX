[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dotsystemx"
version = "1.11.0b4"
description = "Portable project context, coordination, and additive template version management"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = [".SYSTEMX/LICENSE"]
dependencies = []
keywords = ["systemx", "project-memory", "llm", "project-template"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
systemx = "systemx.cli:main"

[project.urls]
Issues = "https://github.com/WayneTechLab/dotSYSTEMX/issues"
Repository = "https://github.com/WayneTechLab/dotSYSTEMX"
Documentation = "https://github.com/WayneTechLab/dotSYSTEMX/wiki"
Changelog = "https://github.com/WayneTechLab/dotSYSTEMX/wiki/Versions-and-Changelog"

[tool.setuptools]
packages = ["systemx"]
package-dir = {systemx = ".SYSTEMX"}
include-package-data = false

[tool.setuptools.package-data]
systemx = ["ROOT/*.md", "ROOT/*.json", "templates/root/*.md", "templates/root/*.json",
           "AUTOBOT/*.MD", "AUTOBOT/*.md", "AUTOBOT/*.json", "AGENTS/agent.a/*.md",
           "templates/autobot/*.MD", "templates/autobot/*.md", "templates/autobot/*.json",
           "DATA/.gitignore", "DATA/README.md", "DATA/TEMP/README.md", "DATA/LARGE/README.md",
           "DATA/IMPORTS/README.md", "DATA/RESEARCH/README.md", "DATA/ASSETS/README.md",
           "DATA/EXPORTS/README.md", "DATA/CACHE/README.md", "DATA/ARCHIVE/README.md",
           "templates/data/.gitignore", "templates/data/README.md",
           "templates/data/TEMP/README.md", "templates/data/LARGE/README.md",
           "templates/data/IMPORTS/README.md", "templates/data/RESEARCH/README.md",
           "templates/data/ASSETS/README.md", "templates/data/EXPORTS/README.md",
           "templates/data/CACHE/README.md", "templates/data/ARCHIVE/README.md",
           ".gitignore", ".gitattributes", "LICENSE", "VERSION", "*.md", "*.json", "*.sh", "*.ps1",
           "config/*.json", "AI/*.md", "AI/*.json", "GLOBAL/*.md", "GLOBAL/*.json", "GLOBAL/*.xlsx", "PLAN/*.md",
           "AGENTB/*.md", "AGENTB/*.MD", "AGENTB/*.json", "AGENTB/.gitignore",
           "templates/agentb/*.md", "templates/agentb/*.MD", "templates/agentb/*.json", "templates/agentb/.gitignore",
           "templates/agenda/*.json",
           "SECURITY/AGENT1/*.md", "SECURITY/AGENT1/*.json", "Setup/*.md", "Uninstall/*.md",
           "WORK/*.md", "WORK/*.json", "MEMORY/*.md", "MEMORY/sessions/*.md",
           "AGENTS/*.md", "AGENTS/*.json", "AGENTS/agent.0/*.md", "AGENTS/agent.x/*.md", "AGENTS/agent.y/*.md", "AGENTS/agent.z/*.md", "templates/*.md",
           "docs/*.md", "profiles/*.md", "scripts/*.py", "scripts/*.sh", "tests/*.py",
           "MEDIA/*.md", "MEDIA/White-Paper/*.md", "MEDIA/White-Paper/*.json", "MEDIA/White-Paper/*.pdf", "MEDIA/White-Paper/*.py",
           "MEDIA/White-Paper/figures/*.png", "MEDIA/White-Paper/figures/*.svg",
           "MEDIA/Infographics/*.svg", "MEDIA/Reference/*.md", "MEDIA/Reference/*.json",
           "Projects/*.md", "Projects/*.json", "templates/project/*.md", "templates/project/*.json",
           "templates/project/GLOBAL/*.md", "templates/project/PLAN/*.md",
           "templates/project/MEMORY/*.md", "templates/project/MEMORY/sessions/*.md",
           "templates/project/AGENTS/*.json", "templates/project/AGENTS/agent.0/*.md",
           "templates/project/WORK/*.md", "templates/project/WORK/*.json",
           "templates/project/DECISIONS/*.md", "templates/project/SYNC/*.md"]
