<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="720" viewBox="0 0 1060 720" role="img" aria-labelledby="title desc">
<title id="title">4. A context-budget illustration, not a measured benchmark</title>
<desc id="desc">Hypothetical input tokens: equal turns and task payload, plus recording and setup overhead.</desc>
<rect x="0" y="0" width="1060" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="28" y="39" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#152832" text-anchor="start">4. A context-budget illustration, not a measured benchmark</text>
<text x="28" y="73" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#4B626D" text-anchor="start">Hypothetical input tokens: equal turns and task payload, plus recording and setup overhead.</text>
<line x1="28" y1="92" x2="1032" y2="92" stroke="#BCCDD3" stroke-width="1.5"/>
<rect x="28" y="115" width="1004" height="90" rx="10" fill="#FFF4DC" stroke="none" stroke-width="1.5"/>
<text x="46" y="150" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#9B5C00" text-anchor="start">ILLUSTRATIVE ASSUMPTIONS</text>
<text x="46" y="183" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#9B5C00" text-anchor="start">100 turns; full context 12,000; selected context 2,500; shared payload 2,000 tokens / turn.</text>
<text x="28" y="248" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0B696D" text-anchor="start">CUMULATIVE ILLUSTRATIVE INPUT TOKENS</text>
<text x="28" y="305" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#152832" text-anchor="start">Full-context baseline</text>
<rect x="270" y="277" width="742" height="52" rx="3" fill="#D9E4E8" stroke="none" stroke-width="1.5"/>
<text x="284" y="311" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#152832" text-anchor="start">1,400,000</text>
<text x="28" y="388" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#152832" text-anchor="start">Selected context</text>
<rect x="270" y="360" width="269.24" height="52" rx="3" fill="#0B696D" stroke="none" stroke-width="1.5"/>
<text x="284" y="394" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="start">508,000</text>
<text x="557.24" y="394" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0B696D" text-anchor="start">892,000 fewer (63.7%)</text>
<text x="28" y="458" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#152832" text-anchor="start">Baseline = N x (C + H) = 100 x (12,000 + 2,000)</text>
<text x="28" y="495" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#152832" text-anchor="start">Selected = N x (S + H + W) + K = 100 x (2,500 + 2,000 + 500) + 8,000</text>
<text x="28" y="540" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#4B626D" text-anchor="start">W = recording/reconciliation overhead per turn; K = one-time setup, both in tokens.</text>
<rect x="28" y="570" width="1004" height="75" rx="10" fill="#F3F7F8" stroke="none" stroke-width="1.5"/>
<text x="46" y="601" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#152832" text-anchor="start">Excluded: output tokens, cache discounts, retries, tool charges and workload differences.</text>
<text x="46" y="630" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#152832" text-anchor="start">This model does not establish cost, latency, accuracy or completion-rate improvements.</text>
<line x1="28" y1="672" x2="1032" y2="672" stroke="#BCCDD3" stroke-width="1.5"/>
<text x="28" y="699" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#4B626D" text-anchor="start">Measure comparable runs and count all agent calls. No measured savings are claimed for .SYSTEMX.</text>
</svg>
