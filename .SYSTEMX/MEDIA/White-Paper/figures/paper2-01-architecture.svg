<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="720" viewBox="0 0 1060 720" role="img" aria-labelledby="title desc">
<title id="title">1. Records preserve context; roles coordinate work</title>
<desc id="desc">Within one selected .SYSTEMX or .SYSTEMXP scope; the host supplies tools and permissions.</desc>
<rect x="0" y="0" width="1060" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="28" y="39" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#152832" text-anchor="start">1. Records preserve context; roles coordinate work</text>
<text x="28" y="73" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#4B626D" text-anchor="start">Within one selected .SYSTEMX or .SYSTEMXP scope; the host supplies tools and permissions.</text>
<line x1="28" y1="92" x2="1032" y2="92" stroke="#BCCDD3" stroke-width="1.5"/>
<rect x="28" y="110" width="1004" height="58" rx="10" fill="#FFF4DC" stroke="none" stroke-width="1.5"/>
<text x="46" y="146" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#9B5C00" text-anchor="start">Actual instructions, authorization and host capabilities remain authoritative.</text>
<text x="28" y="205" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0B696D" text-anchor="start">RECORD AUTHORITY</text>
<text x="670" y="205" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0B696D" text-anchor="start">ROLE RESPONSIBILITIES</text>
<rect x="28" y="220" width="616" height="76" rx="10" fill="#F3F7F8" stroke="#BCCDD3" stroke-width="1.5"/>
<text x="44" y="249" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#152832" text-anchor="start">GLOBAL/CONTEXT.md + PLAN/MASTER-PLAN.md</text>
<text x="44" y="278" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#4B626D" text-anchor="start">Purpose, constraints, outcomes and acceptance criteria.</text>
<rect x="28" y="306" width="616" height="76" rx="10" fill="#EAF5F4" stroke="#0B696D" stroke-width="1.5"/>
<text x="44" y="335" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#152832" text-anchor="start">WORK/TASKS.json</text>
<text x="44" y="364" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#4B626D" text-anchor="start">Only canonical task status; IDs, owner, evidence, history.</text>
<rect x="28" y="392" width="616" height="76" rx="10" fill="#F3F7F8" stroke="#BCCDD3" stroke-width="1.5"/>
<text x="44" y="421" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#152832" text-anchor="start">ROOT/ + SX-RULES.md + SX-MILESTONE.md</text>
<text x="44" y="450" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#4B626D" text-anchor="start">PLAN.json: structure; MIRRORS.json: observations/tool cards.</text>
<rect x="28" y="478" width="616" height="76" rx="10" fill="#F3F7F8" stroke="#BCCDD3" stroke-width="1.5"/>
<text x="44" y="507" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#152832" text-anchor="start">EVENTS/ + REVIEWS/ + MEMORY/</text>
<text x="44" y="536" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#4B626D" text-anchor="start">Event evidence, repeatable review and resumable facts.</text>
<rect x="28" y="564" width="616" height="76" rx="10" fill="#F3F7F8" stroke="#BCCDD3" stroke-width="1.5"/>
<text x="44" y="593" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#152832" text-anchor="start">AUTOBOT/ + selected reference files</text>
<text x="44" y="622" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#4B626D" text-anchor="start">On-demand context; references do not grant authority.</text>
<rect x="670" y="220" width="362" height="76" rx="10" fill="#FFFFFF" stroke="#BCCDD3" stroke-width="1.5"/>
<text x="686" y="249" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0B696D" text-anchor="start">Agent 0</text>
<text x="686" y="277" font-family="Arial, Helvetica, sans-serif" font-size="19.5" font-weight="400" fill="#4B626D" text-anchor="start">Coordinate, integrate, accept.</text>
<rect x="670" y="306" width="362" height="76" rx="10" fill="#FFFFFF" stroke="#BCCDD3" stroke-width="1.5"/>
<text x="686" y="335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0B696D" text-anchor="start">Agent X</text>
<text x="686" y="363" font-family="Arial, Helvetica, sans-serif" font-size="19.5" font-weight="400" fill="#4B626D" text-anchor="start">Record events, time and due items.</text>
<rect x="670" y="392" width="362" height="76" rx="10" fill="#FFFFFF" stroke="#BCCDD3" stroke-width="1.5"/>
<text x="686" y="417" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0B696D" text-anchor="start">Agent Y</text>
<text x="686" y="440" font-family="Arial, Helvetica, sans-serif" font-size="19.5" font-weight="400" fill="#4B626D" text-anchor="start">Run selected CLI;</text>
<text x="686" y="462" font-family="Arial, Helvetica, sans-serif" font-size="19.5" font-weight="400" fill="#4B626D" text-anchor="start">retain job/PR evidence.</text>
<rect x="670" y="478" width="362" height="76" rx="10" fill="#FFFFFF" stroke="#BCCDD3" stroke-width="1.5"/>
<text x="686" y="507" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0B696D" text-anchor="start">Agent Z</text>
<text x="686" y="535" font-family="Arial, Helvetica, sans-serif" font-size="19.5" font-weight="400" fill="#4B626D" text-anchor="start">Review: 100 questions / 10 categories.</text>
<rect x="670" y="564" width="362" height="76" rx="10" fill="#FFFFFF" stroke="#BCCDD3" stroke-width="1.5"/>
<text x="686" y="593" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0B696D" text-anchor="start">Agent Alpha</text>
<text x="686" y="621" font-family="Arial, Helvetica, sans-serif" font-size="19.5" font-weight="400" fill="#4B626D" text-anchor="start">Route up to 10 AUTOBOT references.</text>
<line x1="28" y1="672" x2="1032" y2="672" stroke="#BCCDD3" stroke-width="1.5"/>
<text x="28" y="699" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#4B626D" text-anchor="start">Role records do not launch models. X does not execute schedules; Z scores do not accept tasks.</text>
</svg>
