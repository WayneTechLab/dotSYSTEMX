<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="720" viewBox="0 0 1060 720" role="img" aria-labelledby="title desc">
<title id="title">3. Project records and versioned defaults have different owners</title>
<desc id="desc">One outer installation supplies reviewed tools; each named child retains its own records.</desc>
<rect x="0" y="0" width="1060" height="720" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="28" y="39" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#152832" text-anchor="start">3. Project records and versioned defaults have different owners</text>
<text x="28" y="73" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#4B626D" text-anchor="start">One outer installation supplies reviewed tools; each named child retains its own records.</text>
<line x1="28" y1="92" x2="1032" y2="92" stroke="#BCCDD3" stroke-width="1.5"/>
<rect x="28" y="116" width="490" height="409" rx="10" fill="#F3F7F8" stroke="#BCCDD3" stroke-width="1.5"/>
<text x="46" y="150" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0B696D" text-anchor="start">SELECTED RECORD SCOPE</text>
<text x="46" y="189" font-family="monospace" font-size="25" font-weight="700" fill="#152832" text-anchor="start">.SYSTEMX/</text>
<text x="66" y="225" font-family="monospace" font-size="23" font-weight="400" fill="#152832" text-anchor="start">GLOBAL/  PLAN/  WORK/</text>
<text x="66" y="257" font-family="monospace" font-size="23" font-weight="400" fill="#152832" text-anchor="start">ROOT/  MEMORY/  AGENTS/</text>
<text x="66" y="289" font-family="monospace" font-size="23" font-weight="400" fill="#152832" text-anchor="start">EVENTS/  REVIEWS/  DATA/</text>
<line x1="64" y1="333" x2="64" y2="395" stroke="#0B696D" stroke-width="2"/>
<line x1="64" y1="395" x2="90" y2="395" stroke="#0B696D" stroke-width="2"/>
<text x="92" y="364" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#152832" text-anchor="start">Projects/Project-A/.SYSTEMXP/</text>
<text x="92" y="401" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#152832" text-anchor="start">Own tasks, ROOT, memory and evidence.</text>
<text x="92" y="437" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#152832" text-anchor="start">Scope + TASK ID identifies the record.</text>
<text x="46" y="491" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#9B5C00" text-anchor="start">Never nest another .SYSTEMX inside a scope.</text>
<rect x="544" y="116" width="488" height="409" rx="10" fill="#FFFFFF" stroke="#BCCDD3" stroke-width="1.5"/>
<text x="562" y="150" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#0B696D" text-anchor="start">MANAGED DEFAULT SELECTION</text>
<text x="562" y="189" font-family="monospace" font-size="24" font-weight="700" fill="#152832" text-anchor="start">INSTALLATION.json</text>
<text x="562" y="224" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#152832" text-anchor="start">Selects the reviewed defaults version.</text>
<line x1="602" y1="238" x2="602" y2="265" stroke="#0B696D" stroke-width="2"/>
<line x1="602" y1="265" x2="598.0853101929989" y2="256.8959760788259" stroke="#0B696D" stroke-width="2"/>
<line x1="602" y1="265" x2="605.9146898070011" y2="256.8959760788259" stroke="#0B696D" stroke-width="2"/>
<text x="562" y="296" font-family="monospace" font-size="24" font-weight="700" fill="#152832" text-anchor="start">.SYSTEMX/.systemx/</text>
<text x="582" y="331" font-family="monospace" font-size="24" font-weight="700" fill="#152832" text-anchor="start">releases/&lt;version&gt;/</text>
<text x="582" y="368" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#152832" text-anchor="start">Retained versioned default snapshots.</text>
<text x="562" y="414" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#152832" text-anchor="start">Ordinary updates add missing root files.</text>
<text x="562" y="443" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#152832" text-anchor="start">Existing project files and old defaults stay.</text>
<text x="562" y="472" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#152832" text-anchor="start">Managed runner uses selected tools;</text>
<text x="562" y="501" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#152832" text-anchor="start">writes go to the selected project records.</text>
<rect x="28" y="551" width="1004" height="93" rx="10" fill="#FFF4DC" stroke="none" stroke-width="1.5"/>
<text x="46" y="584" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#9B5C00" text-anchor="start">BOUNDARIES</text>
<text x="46" y="615" font-family="Arial, Helvetica, sans-serif" font-size="20.5" font-weight="400" fill="#9B5C00" text-anchor="start">Git ignored is not private. A worktree is not an OS sandbox. Shared Drive is not a distributed lock.</text>
<line x1="28" y1="672" x2="1032" y2="672" stroke="#BCCDD3" stroke-width="1.5"/>
<text x="28" y="699" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#4B626D" text-anchor="start">Manual updates by default. Opt-in startup checks notify; bootstrap refresh is separate and backed up.</text>
</svg>
