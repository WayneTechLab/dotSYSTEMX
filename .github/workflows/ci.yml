name: Template and installer checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate pristine distribution
        run: python -B .SYSTEMX/scripts/systemx.py validate --template
      - name: Test project records and additive updates
        run: python -B -m unittest discover -s .SYSTEMX/tests -v
      - name: Exercise Windows installation and managed launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'SYSTEMX project with spaces'
          & .\.SYSTEMX\INSTALL.ps1 --target $target --profile directory
          if ($LASTEXITCODE -ne 0) { throw 'Installation failed' }
          & (Join-Path $target '.SYSTEMX\SYSTEMX.ps1') validate
          if ($LASTEXITCODE -ne 0) { throw 'Managed validation failed' }
      - name: Build library wheel
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: python -m pip wheel . --no-deps --wheel-dir dist
