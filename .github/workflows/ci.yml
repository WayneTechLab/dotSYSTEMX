name: Template and installer checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate pristine distribution
        run: python -B .SYSTEMX/scripts/release.py --check
      - name: Report exact tool and package versions
        run: python -B .SYSTEMX/manager.py --version
      - name: Test project records and additive updates
        run: python -B -m unittest discover -s .SYSTEMX/tests -v
      - name: Exercise Windows installation and managed launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'SYSTEMX project with spaces'
          & .\.SYSTEMX\INSTALL.ps1 --target $target --profile directory --lowercase-alias
          if ($LASTEXITCODE -ne 0) { throw 'Installation failed' }
          & (Join-Path $target '.SYSTEMX\SYSTEMX.ps1') validate
          if ($LASTEXITCODE -ne 0) { throw 'Managed validation failed' }
          & (Join-Path $target '.SYSTEMX\SYSTEMX.ps1') paths
          if ($LASTEXITCODE -ne 0) { throw 'Exact-case inspection failed' }
          python -B .SYSTEMX/manager.py first-run --target $target --apply
          if ($LASTEXITCODE -ne 0) { throw 'First-run failed' }
          & (Join-Path $target '.SYSTEMX\SYSTEMX.ps1') projects add 'Project A' --kind software --apply
          if ($LASTEXITCODE -ne 0) { throw 'Child project setup failed' }
          & (Join-Path $target '.SYSTEMX\SYSTEMX.ps1') projects context --project 'Project A' --agent agent.0
          if ($LASTEXITCODE -ne 0) { throw 'Scoped context failed' }
          & (Join-Path $target '.SYSTEMX\SYSTEMX.ps1') projects roles-init --project 'Project A' --apply
          if ($LASTEXITCODE -ne 0) { throw 'Standard role setup failed' }
          & (Join-Path $target '.SYSTEMX\SYSTEMX.ps1') projects agent-x due --project 'Project A'
          if ($LASTEXITCODE -ne 0) { throw 'Agent X due tracking failed' }
          & (Join-Path $target '.SYSTEMX\SYSTEMX.ps1') projects agent-z policy --project 'Project A' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Agent Z policy load failed' }
          & (Join-Path $target '.SYSTEMX\SYSTEMX.ps1') projects validate
          if ($LASTEXITCODE -ne 0) { throw 'Child record validation failed' }
          $backup = Join-Path $env:RUNNER_TEMP 'SYSTEMX removal backup'
          python -B .SYSTEMX/manager.py uninstall --target $target --backup $backup --apply
          if ($LASTEXITCODE -ne 0) { throw 'Removal failed' }
          python -B .SYSTEMX/manager.py audit --target $target
          if ($LASTEXITCODE -ne 0) { throw 'Removal audit failed' }
          python -B .SYSTEMX/manager.py restore --target $target --backup $backup --apply
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          & (Join-Path $target '.SYSTEMX\SYSTEMX.ps1') validate
          if ($LASTEXITCODE -ne 0) { throw 'Restored validation failed' }
      - name: Build library wheel
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install built library and verify entry point
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: |
          python -m pip install --no-index --no-deps dist/*.whl
          systemx --version
